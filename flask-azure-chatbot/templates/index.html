<!DOCTYPE html>
<html>
<head>
    <title>Azure OpenAI Chatbot</title>

    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

</head>
<body>

<div class="container mt-4">

    <h2>Azure OpenAI Chatbot</h2>

    <div class="card mb-3">
        <div class="card-body">

            <input
            class="form-control mb-2"
            id="endpoint"
            placeholder="Azure OpenAI Endpoint">

            <input
            class="form-control mb-2"
            id="api_key"
            type="password"
            placeholder="API Key">

            <input
            class="form-control mb-2"
            id="deployment"
            placeholder="Deployment Name">

            <input
            class="form-control"
            id="api_version"
            value="2024-10-21">

        </div>
    </div>


    <div class="card">
        <div class="card-body">

            <div
            id="chat-box"
            style="height:400px;overflow-y:auto">
            </div>

            <input
            id="message"
            class="form-control mt-3"
            placeholder="Type your message">

            <button
            class="btn btn-primary mt-3"
            onclick="sendMessage()">
                Send
            </button>

        </div>
    </div>

</div>

<script>

async function sendMessage() {

    const endpoint = document.getElementById("endpoint").value;
    const api_key = document.getElementById("api_key").value;
    const deployment = document.getElementById("deployment").value;
    const api_version = document.getElementById("api_version").value;
    const message = document.getElementById("message").value;

    document.getElementById("chat-box").innerHTML +=
        `<p><b>You:</b> ${message}</p>`;

    const response = await fetch("/chat", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            endpoint,
            api_key,
            deployment,
            api_version,
            message
        })
    });

    const data = await response.json();

    document.getElementById("chat-box").innerHTML +=
        `<p><b>Bot:</b> ${data.response}</p>`;

    document.getElementById("message").value = "";

}

</script>

</body>
</html>
